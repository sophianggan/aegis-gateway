[build-system]
requires = ["hatchling>=1.32.0"]
build-backend = "hatchling.build"

[project]
name = "aegis-gateway"
version = "0.1.0"
description = "Policy-enforced AI gateway for sensitive data environments"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sophie" }]
dependencies = [
  "asyncpg>=0.31.0,<1",
  "fastapi>=0.141.1,<1",
  "httpx>=0.28.1,<1",
  "pydantic-settings>=2.15.0,<3",
  "pyjwt[crypto]>=2.13.0,<3",
  "structlog>=26.1.0,<27",
  "uvicorn[standard]>=0.52.4,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=2.3.1,<3",
  "pytest>=9.1.1,<10",
  "pytest-asyncio>=1.4.0,<2",
  "pytest-cov>=7.1.0,<8",
  "respx>=0.23.1,<1",
  "ruff>=0.16.5,<1",
]

[project.scripts]
aegis = "aegis.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aegis", "src/aegis_sdk"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "postgres: requires an isolated PostgreSQL service",
  "redteam: adversarial security regression suite",
]

[tool.coverage.run]
branch = true
source = ["aegis", "aegis_sdk"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["aegis", "aegis_sdk"]

[[tool.mypy.overrides]]
module = "asyncpg.*"
ignore_missing_imports = true
